<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Genesys X Salon | Enquiry</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="header-container">

            <h1>Genesys X Salon</h1>

            <!-- Navigation -->
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about-us.html">About Us</a></li>
                    <li><a href="enquiry.html">Enquiry</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>


    <main>

        <!-- Enquiry introduction -->
        <section>

            <h2>Make an Enquiry</h2>

            <!-- RESPONSIVE IMAGE -->
            <img
                src="images/istockphoto-2239632171-1024x1024.jpg"
                srcset="
                    images/enquiry-small.jpg 480w,
                    images/enquiry-medium.jpg 768w,
                    images/enquiry-large.jpg 1200w
                "
                sizes="
                    (max-width: 480px) 100vw,
                    (max-width: 768px) 90vw,
                    1200px
                "
                alt="Genesys X Salon enquiry"
                class="responsive-image">

            <p>
                Complete the form below to enquire about our services
                or request an appointment.
            </p>

        </section>


        <!-- Enquiry form -->
        <section>

            <div class="form-container">

                <form>

                    <label for="name">
                        Full Name:
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>


                    <label for="email">
                        Email Address:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>


                    <label for="phone">
                        Phone Number:
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number">


                    <label for="service">
                        Select a Service:
                    </label>

                    <select id="service" name="service">

                        <option value="">
                            Choose a service
                        </option>

                        <option value="haircut">
                            Haircut
                        </option>

                        <option value="styling">
                            Hair Styling
                        </option>

                        <option value="treatment">
                            Hair Treatment
                        </option>

                        <option value="special">
                            Special Occasion Styling
                        </option>

                        <option value="consultation">
                            Consultation
                        </option>

                    </select>


                    <label for="date">
                        Preferred Date:
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date">


                    <label for="message">
                        Message:
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Tell us how we can help you..."
                        required></textarea>


                    <button type="submit">
                        Submit Enquiry
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Genesys X Salon. All Rights Reserved.</p>
    </footer>

</body>
</html>
